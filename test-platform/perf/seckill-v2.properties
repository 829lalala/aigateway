# 秒杀压测 v2 专用属性文件（JMeter -p 参数指定）
#
# 为什么需要这个文件（2026-11-18 修复）：
#   seckill-v2.jmx 的设计目标是"按业务码分组出分位数"，靠 JSONPostProcessor 把
#   $.code 提取成变量 bizCode。但 JMeter 的变量默认**不会**写进 JTL——必须由
#   sample_variables 声明。若改用计划内 ResultCollector 来配置 saveConfig，
#   会重新引入 v1 的双写 bug（ResultCollector 与 CLI -l 同指一个文件，每请求写两行，
#   吞吐分子翻倍，547 QPS 事故就是这样产生的）。
#   因此这里用"外部属性文件 + CLI -l"的组合：变量落 JTL，且只有单一写入方。
#
# 用法：
#   jmeter -n -t seckill-v2.jmx -p seckill-v2.properties -l results-v2.jtl -e -o report-v2

# 把 bizCode 变量写入 JTL 的每个样本行（0=成功 / 400=已抢过 / 409=抢完）
sample_variables=bizCode

# 不保存响应体：200 并发 * 100 码的响应体很小，但默认关闭可减小 JTL 体积、
# 且避免响应体中可能出现的 userId 等信息落盘。若需事后复核响应原文，改成 true。
jmeter.save.saveservice.response_data=false

# 保留断言失败原因，便于排查（例如业务码落到了 ^(0|400|409)$ 之外）
jmeter.save.saveservice.assertion_results_failure_message=true

# 输出格式：CSV，字段包含断言结果与响应码
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true

# 时间戳用毫秒（与 verify-perf.sh 的复算口径一致：第 1 列必须是毫秒时间戳）
jmeter.save.saveservice.timestamp_format=ms
