# 虚拟线程 A/B 对照压测属性文件（JMeter -p 参数指定）
#
# 用途：chat-vt.jmx 跑 /chat 非流式接口，测量平台线程 vs 虚拟线程的吞吐差异。
# 用法：
#   # A 组（平台线程，threads.max=20）
#   jmeter -n -t chat-vt.jmx -p chat-vt.properties -l chat-vt-baseline.jtl
#   # B 组（虚拟线程）
#   jmeter -n -t chat-vt.jmx -p chat-vt.properties -l chat-vt.jtl
#
# 2026-11-18 说明：原 chat-vt.jmx 内置 ResultCollector 且 filename 写死，
# 与 CLI -l 同指一文件会造成双写（历史 80 行 / 40 唯一请求正是如此）。
# 已删除该收集器，统一由 -l 指定输出，字段由本文件声明。

jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.timestamp_format=ms

# 不保存响应体：/chat 响应很小，且响应里可能含模型输出，无需落盘
jmeter.save.saveservice.response_data=false

# 保留断言失败原因，便于区分"上游超时"与"业务拒绝"
jmeter.save.saveservice.assertion_results_failure_message=true
