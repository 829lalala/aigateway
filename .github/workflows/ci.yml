# 持续集成流水线：每次推送 / 发起合并请求时，在干净的云端环境自动执行单元测试
#
# 分层策略（与 README "测试分层与执行" 一致）：
#   - CI 只跑默认 profile = 单元测试（零外部依赖，秒级反馈）
#   - 集成测试需要 MySQL/Redis/Kafka，归入本地或带容器的环境，不进本流水线
#   - 真实 LLM 调用测试（manual 标签）产生费用，永远默认排除
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21（Temurin 发行版，缓存 Maven 本地仓库加速后续构建）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: aigateway 单元测试
        working-directory: aigateway
        run: mvn -B test

      - name: test-platform 构建与单元测试
        working-directory: test-platform
        # 当前全部用例为 integration/manual 标签，默认 profile 零测试可跑；
        # failIfNoSpecifiedTests=false 放行空跑（确保至少完成编译验证），
        # 后续新增纯单元测试后自动纳入执行
        run: mvn -B test "-Dsurefire.failIfNoSpecifiedTests=false"
