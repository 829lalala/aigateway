spring.application.name=aigateway

# ============ 数据源配置 ============
# JDBC 连接串格式：jdbc:mysql://主机:端口/库名?参数
#   useUnicode/characterEncoding：客户端与服务端通信用 UTF-8（mb4 由连接参数 utf8mb4 隐含支持）
#   serverTimezone：显式指定时区，避免驱动与服务器时区不一致导致时间字段偏移 8 小时
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/aigateway?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
# 密码不写在入库文件里，由环境变量或 application-local.properties 提供
spring.profiles.active=local

# ============ MyBatis-Plus 配置 ============
# 实体类所在包，MP 启动时扫描并建表元数据缓存
mybatis-plus.type-aliases-package=com.aigateway.entity
# 打印 SQL 日志（开发期用，生产必须关：SQL 日志暴露数据且拖性能）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ============ JWT 配置 ============
# 签名密钥：HS256 要求至少 32 字节；生产环境应放环境变量/配置中心，此处简化演示
jwt.secret=${JWT_SECRET}
# 令牌有效期：24 小时（毫秒）
jwt.expire-millis=86400000

# ============ 大模型 API 配置 ============
# 智谱开放平台基础地址（OpenAI 兼容协议），API Key 在 local 档案文件里
llm.base-url=${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
llm.api-key=${LLM_API_KEY:}

# ============ Redis 配置 ============
# Docker 容器映射到本机 6379（阶段 0 部署）
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ============ 模型路由配置（阶段 7） ============
# 主备模型链：从左到右依次尝试，主模型失败自动切下一个（顺序即优先级）
llm.route-chain=glm-4-flash,glm-4-air,glm-4-plus
# 熔断器：同一模型连续失败达阈值 → 打开（跳过），冷却期满转半开放行试探
llm.breaker.threshold=3
llm.breaker.cooldown-millis=60000

# ============ Kafka 配置（阶段 10） ============
spring.kafka.bootstrap-servers=localhost:9092
# 消费者组：同组分摊消费；auto-offset-reset=earliest 使新消费者组能补消费历史消息
spring.kafka.consumer.group-id=aigateway
spring.kafka.consumer.auto-offset-reset=earliest

# ============ 线程模型（阶段 16） ============
# 虚拟线程：Tomcat 执行器整体切换（Boot 4 内置支持）
# 受益点是非流式 /chat（RestClient 同步阻塞等 LLM 数秒）与 JDBC 阻塞——
# 阻塞时载体线程释放，200 平台线程上限不再约束并发数；
# SSE 本身已是 Servlet 异步不占线程，与虚拟线程无交集（诚实标注）
# A/B 实测（server.tomcat.threads.max=20 制造瓶颈，40 并发阻塞 chat）：
#   平台线程 4s/10.9 QPS/Avg 2058ms → 虚拟线程 3s/14.5 QPS/Avg 1338ms（吞吐 +33%，尾部延迟 -35%）
spring.threads.virtual.enabled=true

# ============ 限流配置（阶段 14） ============
# 按 API Key 令牌桶限流：capacity=突发上限（桶满一次可打出），rate=长期速率（每秒补充令牌）
ratelimit.api-key.capacity=10
ratelimit.api-key.rate=10

# ============ 计费配置（按模型定价） ============
# 每模型单价：万分之一元/千 token（cost = ceil(total_tokens/1000) × 该模型单价）
# 参考真实价：flash≈0.1 元/百万 token -> 1；air≈0.5 -> 5；plus≈5 -> 50
billing.model-prices.glm-4-flash=1
billing.model-prices.glm-4-air=5
billing.model-prices.glm-4-plus=50
# 路由链外/未配置模型的默认单价
billing.default-price-per-1k-tokens=5
